# Let's Encrypt production issuer (HTTP-01 via Traefik Ingress).
# Replace the email on the node before first certificate request if desired.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: abysso-platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@abysso.ir
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
