# Node hostmetrics → in-cluster SigNoz OTLP (ClusterIP).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-agent
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: otel-node-agent
    app.kubernetes.io/part-of: abysso-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-node-agent
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "0.127.0"
    spec:
      serviceAccountName: default
      hostPID: true
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.127.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: HOST_PROC
              value: /hostfs/proc
            - name: HOST_SYS
              value: /hostfs/sys
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: true
            - name: hostfs-proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: hostfs-sys
              mountPath: /hostfs/sys
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
      volumes:
        - name: conf
          configMap:
            name: otel-node-agent-config
        - name: hostfs-proc
          hostPath:
            path: /proc
        - name: hostfs-sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-agent-config
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: otel-node-agent
data:
  config.yaml: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          load: {}
          disk: {}
          network: {}
    processors:
      resource:
        attributes:
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert
          - key: service.name
            value: node-hostmetrics
            action: upsert
          - key: service.version
            value: "0.127.0"
            action: upsert
      batch:
        timeout: 5s
    exporters:
      otlp:
        endpoint: signoz-otel-collector.platform-observability.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics]
          processors: [resource, batch]
          exporters: [otlp]
