# Node hostmetrics + container logs → in-cluster SigNoz OTLP (ClusterIP).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-agent
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: otel-node-agent
    app.kubernetes.io/part-of: abysso-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-agent
  labels:
    app.kubernetes.io/name: otel-node-agent
    app.kubernetes.io/part-of: abysso-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-agent
  labels:
    app.kubernetes.io/name: otel-node-agent
    app.kubernetes.io/part-of: abysso-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-agent
subjects:
  - kind: ServiceAccount
    name: otel-node-agent
    namespace: platform-observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-agent
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: otel-node-agent
    app.kubernetes.io/part-of: abysso-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-node-agent
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "0.127.0"
    spec:
      serviceAccountName: otel-node-agent
      hostPID: true
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.127.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: HOST_PROC
              value: /hostfs/proc
            - name: HOST_SYS
              value: /hostfs/sys
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: true
            - name: hostfs-proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: hostfs-sys
              mountPath: /hostfs/sys
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: conf
          configMap:
            name: otel-node-agent-config
        - name: hostfs-proc
          hostPath:
            path: /proc
        - name: hostfs-sys
          hostPath:
            path: /sys
        - name: varlogpods
          hostPath:
            path: /var/log/pods
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-agent-config
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: otel-node-agent
data:
  config.yaml: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          load: {}
          disk: {}
          network: {}
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/otelcol*/*.log
          - /var/log/pods/*/otel-node-agent*/*.log
        start_at: end
        include_file_path: true
        operators:
          - type: container
            id: container-parser
    processors:
      resource/host:
        attributes:
          - key: host.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert
          - key: service.name
            value: node-hostmetrics
            action: upsert
          - key: service.version
            value: "0.127.0"
            action: upsert
      resource/logs:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.container.name
      batch:
        timeout: 5s
        send_batch_size: 256
    exporters:
      otlp:
        endpoint: signoz-otel-collector.platform-observability.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [hostmetrics]
          processors: [resource/host, batch]
          exporters: [otlp]
        logs:
          receivers: [filelog]
          processors: [resource/logs, k8sattributes, batch]
          exporters: [otlp]
