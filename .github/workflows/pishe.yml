# CI/CD for Pishe (apps/pishe) → GHCR + SSH deploy to vps-berlin-1
name: pishe-cd

on:
  pull_request:
    paths:
      - "apps/pishe/**"
      - ".github/workflows/pishe.yml"
      - "pipelines/ci/github-actions/pishe.yml"
  push:
    branches: [main, develop, cursor/pishe-business-architecture-bfdd]
    paths:
      - "apps/pishe/**"
      - ".github/workflows/pishe.yml"
      - "pipelines/ci/github-actions/pishe.yml"
  workflow_dispatch:

env:
  SERVICE: pishe
  DOCKERFILE: apps/pishe/Dockerfile
  REGISTRY: ${{ vars.IMAGE_REGISTRY }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.SERVICE }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://pishe.abysso.ir

      - name: Build and push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:main
          build-args: |
            NEXT_PUBLIC_APP_URL=https://pishe.abysso.ir

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PISHE_DEPLOY_HOST }}
          username: ${{ secrets.PISHE_DEPLOY_USER }}
          key: ${{ secrets.PISHE_DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/pishe
            IMAGE="${{ needs.build.outputs.image }}:main"
            echo "Deploying $IMAGE"
            if [[ -n "${{ secrets.REGISTRY_PASSWORD }}" ]]; then
              echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin || true
            fi
            if grep -q '^PISHE_IMAGE=' .env; then
              sed -i "s|^PISHE_IMAGE=.*|PISHE_IMAGE=${IMAGE}|" .env
            else
              echo "PISHE_IMAGE=${IMAGE}" >> .env
            fi
            export PISHE_IMAGE="$IMAGE"
            docker compose pull
            docker compose up -d
            sleep 3
            curl -sfS -m 20 http://127.0.0.1:3010/api/v1/health
            docker compose ps
