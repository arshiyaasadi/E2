# Single-instance Postgres for file-service (ClusterIP only).
apiVersion: v1
kind: Service
metadata:
  name: file-service-pg
  namespace: services-file
  labels:
    app.kubernetes.io/name: file-service-postgres
    app.kubernetes.io/component: service-database
    app.kubernetes.io/part-of: abysso-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: file-service-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: file-service-pg
  namespace: services-file
  labels:
    app.kubernetes.io/name: file-service-postgres
    app.kubernetes.io/component: service-database
    app.kubernetes.io/part-of: abysso-platform
spec:
  serviceName: file-service-pg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service-postgres
        app.kubernetes.io/component: service-database
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "16"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: file_service
            - name: POSTGRES_USER
              value: file_service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: file-service-pg-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "file_service", "-d", "file_service"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
