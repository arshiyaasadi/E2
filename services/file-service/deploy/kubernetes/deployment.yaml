apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: services-file
  labels:
    app.kubernetes.io/name: file-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: abysso-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "0.1.0"
    spec:
      containers:
        - name: file-service
          image: REPLACE_IMAGE_REGISTRY/file-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: file-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=file-service,service.version=0.1.0,deployment.environment=production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signoz-otel-collector.platform-observability.svc:4317
          envFrom:
            - configMapRef:
                name: file-service-config
            - secretRef:
                name: file-service-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
