apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services-file
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - postgres/simple.yaml
# ingress.yaml kept as optional template; production exposes MinIO Console on file.abysso.ir.
