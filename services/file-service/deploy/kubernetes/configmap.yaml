apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: services-file
  labels:
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: abysso-platform
data:
  PORT: "8080"
  KEYCLOAK_ISSUER: "https://REPLACE_KEYCLOAK_HOSTNAME/realms/operators"
  KEYCLOAK_AUDIENCE: ""
  MINIO_ENDPOINT: "http://minio.platform-storage.svc:9000"
  MINIO_REGION: "us-east-1"
  MINIO_BUCKET: "product-images"
  MINIO_FORCE_PATH_STYLE: "true"
  PRODUCT_IMAGE_MAX_BYTES: "5242880"
