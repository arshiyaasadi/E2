apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: abysso-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
