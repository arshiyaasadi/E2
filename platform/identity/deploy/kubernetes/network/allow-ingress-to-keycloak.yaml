apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-keycloak
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    # Ingress controller pods — adjust namespace/labels to your controller.
    - from:
        - namespaceSelector:
            matchLabels:
              platform.e2/ingress-controller: "true"
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
