apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: abysso-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts:
        - REPLACE_KEYCLOAK_HOSTNAME
      secretName: keycloak-tls
  rules:
    - host: REPLACE_KEYCLOAK_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
