# EXAMPLE ONLY — do not store real values in Git.
# Create the live Secret from the secret manager at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak
type: Opaque
stringData:
  KC_DB_PASSWORD: "REPLACE_FROM_SECRET_MANAGER"
  KEYCLOAK_ADMIN: "REPLACE_FROM_SECRET_MANAGER"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_FROM_SECRET_MANAGER"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-pg-secrets
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak-postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_FROM_SECRET_MANAGER"
