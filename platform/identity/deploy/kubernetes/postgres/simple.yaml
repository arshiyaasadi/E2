# Single-instance Postgres for Keycloak on the first single-node bind.
# Replace with CloudNativePG (cluster.yaml) when multi-instance DB is required.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-pg
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/component: identity-database
    app.kubernetes.io/part-of: abysso-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-pg
  namespace: platform-identity
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/component: identity-database
    app.kubernetes.io/part-of: abysso-platform
spec:
  serviceName: keycloak-pg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/component: identity-database
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "16"
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-pg-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
