# SigNoz Helm values for the single-node edge (8 GiB RAM, ~23 GiB disk).
# Install: see docs/deploy.md
# Persistence kept small so PVCs fit beside Keycloak/MinIO/file-service on local-path.
global:
  storageClass: local-path
  imageRegistry: ""

clickhouse:
  installCustomStorageClass: false
  persistence:
    size: 4Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1280Mi
  # Nested Bitnami ZK (chart default heapSize=1024 is too heavy for a shared edge).
  zookeeper:
    replicaCount: 1
    persistence:
      size: 1Gi
    heapSize: 256
    # docker.io/bitnami/zookeeper moved off Hub; use legacy mirror for this chart pin.
    image:
      registry: docker.io
      repository: bitnamilegacy/zookeeper
      tag: 3.7.1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 384Mi

signoz:
  replicaCount: 1
  # First-party channel image (CI → REGISTRY/signoz:main). Until the first
  # successful push, keep the vendor tag by commenting image: and using chart default.
  image:
    registry: ghcr.io/arshiyaasadi
    repository: signoz
    tag: main
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

otelCollector:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
