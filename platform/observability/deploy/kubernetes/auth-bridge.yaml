# Keycloak OIDC gate in front of SigNoz CE (Abysso).
# Create the ConfigMap first from the SSO overlay script:
#   kubectl -n platform-observability create configmap signoz-auth-bridge \
#     --from-file=auth_bridge.py=platform/observability/sso/auth-bridge/auth_bridge.py \
#     --dry-run=client -o yaml | kubectl apply -f -
# Point Ingress at Service signoz-auth-bridge:8080 (not signoz:8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-auth-bridge
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: signoz-auth-bridge
    app.kubernetes.io/part-of: abysso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-auth-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-auth-bridge
        app.kubernetes.io/part-of: abysso-platform
    spec:
      containers:
        - name: auth-bridge
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/auth_bridge.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SIGNOZ_UPSTREAM
              value: http://signoz.platform-observability.svc:8080
            - name: ABYSSO_BRIDGE_PORT
              value: "8080"
            - name: SIGNOZ_BOOTSTRAP_EMAIL
              value: platform-admin@abysso.ir
          envFrom:
            - secretRef:
                name: signoz-oidc
            - secretRef:
                name: signoz-bootstrap
                optional: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: signoz-auth-bridge
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: signoz-auth-bridge
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: signoz-auth-bridge
    app.kubernetes.io/part-of: abysso-platform
spec:
  selector:
    app.kubernetes.io/name: signoz-auth-bridge
  ports:
    - name: http
      port: 8080
      targetPort: http
