apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: platform-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: abysso-platform
data:
  MINIO_REGION_NAME: "us-east-1"
  # S3 API stays ClusterIP (file-service only).
  MINIO_SERVER_URL: "http://minio.platform-storage.svc:9000"
  # Public operator UI (oauth2-proxy + Keycloak) — see file-console-auth.
  MINIO_BROWSER_REDIRECT_URL: "https://REPLACE_MINIO_CONSOLE_HOSTNAME"
