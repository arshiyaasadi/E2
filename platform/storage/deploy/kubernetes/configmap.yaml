apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-config
  namespace: platform-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: abysso-platform
data:
  MINIO_REGION_NAME: "us-east-1"
  # Internal ClusterIP URLs for the first bind (console not public).
  MINIO_SERVER_URL: "http://minio.platform-storage.svc:9000"
  MINIO_BROWSER_REDIRECT_URL: "http://minio.platform-storage.svc:9001"
