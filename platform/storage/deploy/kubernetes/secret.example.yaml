# EXAMPLE ONLY — copy values from the secret manager; never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: platform-storage
type: Opaque
stringData:
  MINIO_ROOT_USER: "REPLACE_MINIO_ROOT_USER"
  MINIO_ROOT_PASSWORD: "REPLACE_MINIO_ROOT_PASSWORD"
  FILE_SERVICE_ACCESS_KEY: "REPLACE_FILE_SERVICE_ACCESS_KEY"
  FILE_SERVICE_SECRET_KEY: "REPLACE_FILE_SERVICE_SECRET_KEY"
---
# SeaweedFS S3 identity file (mounted by the object-store pod).
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-config
  namespace: platform-storage
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "file-service",
          "credentials": [
            {
              "accessKey": "REPLACE_FILE_SERVICE_ACCESS_KEY",
              "secretKey": "REPLACE_FILE_SERVICE_SECRET_KEY"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List"]
        }
      ]
    }
