# Baseline deny-all ingress in the storage namespace.
# Must be applied together with the allow-* policies or pods become unreachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: platform-storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress: []
