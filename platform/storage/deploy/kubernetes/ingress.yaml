# Public object-store console via oauth2-proxy (Keycloak). S3 API stays ClusterIP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  namespace: platform-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: abysso-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts:
        - REPLACE_MINIO_CONSOLE_HOSTNAME
      secretName: minio-console-tls
  rules:
    - host: REPLACE_MINIO_CONSOLE_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: file-console-auth
                port:
                  number: 4180
