# S3-compatible object store for the first bind.
# Official MinIO images are currently unpullable from this edge network;
# SeaweedFS provides an S3 API that file-service already speaks (path-style).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: platform-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: abysso-platform
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: abysso-platform
        app.kubernetes.io/version: "seaweedfs-3.80"
    spec:
      containers:
        - name: minio
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=9000
            - -s3.config=/etc/seaweed/s3.json
            - -master.volumeSizeLimitMB=100
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9333
          env:
            - name: OTEL_SERVICE_NAME
              value: object-storage
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=object-storage,service.version=seaweedfs-3.80,deployment.environment=production
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3cfg
              mountPath: /etc/seaweed
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
      volumes:
        - name: s3cfg
          secret:
            secretName: minio-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
