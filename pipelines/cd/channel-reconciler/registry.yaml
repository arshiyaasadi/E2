# In-cluster registry for first-party images (CI pushes here or images are loaded locally).
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: platform-cd
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: platform-cd
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: abysso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: abysso-platform
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
