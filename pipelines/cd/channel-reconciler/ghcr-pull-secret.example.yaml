# Example: allow the edge to pull private GHCR images.
# Create a PAT with read:packages, then:
#   kubectl -n platform-identity create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=arshiyaasadi \
#     --docker-password=REPLACE_PAT \
#     --docker-email=ops@abysso.ir
# Repeat for platform-observability and services-file (or copy the secret).
# Patch default ServiceAccount: imagePullSecrets: [{name: ghcr-pull}]
#
# Simpler: make the GHCR packages Public so no pull secret is required.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: platform-identity
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"arshiyaasadi","password":"REPLACE_PAT","email":"ops@abysso.ir","auth":"REPLACE_BASE64_USER_PAT"}}}
