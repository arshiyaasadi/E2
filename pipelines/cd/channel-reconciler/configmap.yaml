apiVersion: v1
kind: ConfigMap
metadata:
  name: cd-channels
  namespace: platform-cd
  labels:
    app.kubernetes.io/name: channel-reconciler
data:
  # Must match GitHub Actions var IMAGE_REGISTRY (see pipelines/ci/github-actions/REGISTRY.md).
  REGISTRY: "ghcr.io/arshiyaasadi"
  # Lines: namespace|workload|container|image-name
  # workload = Deployment or StatefulSet name (auto-detected by reconciler)
  CHANNELS: |
    services-file|file-service|file-service|file-service
    platform-identity|keycloak|keycloak|keycloak
    platform-observability|signoz|signoz|signoz
