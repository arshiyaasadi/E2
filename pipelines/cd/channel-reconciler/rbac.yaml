apiVersion: v1
kind: ServiceAccount
metadata:
  name: channel-reconciler
  namespace: platform-cd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: channel-reconciler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: channel-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: channel-reconciler
subjects:
  - kind: ServiceAccount
    name: channel-reconciler
    namespace: platform-cd
